name: Build & Release

# Builds the APK on every push. When the release keystore secrets are set and the
# versionName in app/build.gradle.kts has no release yet, publishes a GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set: building a test APK only, no release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "MTrans-Mobile-$V.apk"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          node -e "
            const w = require('./app/src/main/assets/whatsnew.json');
            const parts = [['new','Mới'],['improved','Cải thiện'],['fixed','Sửa lỗi']]
              .filter(([k]) => w[k] && w[k].length)
              .map(([k,t]) => '### ' + t + '\n' + w[k].map(x => '- ' + x).join('\n'));
            require('fs').writeFileSync('notes.md', parts.join('\n\n') +
              '\n\n---\nTải file **MTrans-Mobile-' + w.version + '.apk** bên dưới về điện thoại để cài. ' +
              'Nếu đã cài, MTrans Mobile sẽ tự báo khi có bản mới.\n\n_Created by Mondiro_');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: MTrans-Mobile-${{ steps.meta.outputs.version }}
          path: MTrans-Mobile-*.apk

      - name: Publish release
        if: steps.ks.outputs.signed == 'true' && steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.meta.outputs.version }}
          gh release create "v$V" "MTrans-Mobile-$V.apk" --repo "$GITHUB_REPOSITORY" \
            --title "MTrans Mobile v$V" --notes-file notes.md --target "$GITHUB_SHA"
